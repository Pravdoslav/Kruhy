name: Publikovanie knihy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/configure-pages@v5
      - name: Vytvorenie PDF a EPUB
        run: |
          quarto render book.qmd --to typst --output Kruhy.pdf
          quarto render book.qmd --to epub --output Kruhy.epub
          mkdir -p downloads
          cp Kruhy.pdf downloads/Kruhy.pdf
          cp Kruhy.epub downloads/Kruhy.epub
      - name: Vytvorenie webu
        run: quarto render --to html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
